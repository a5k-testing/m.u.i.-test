---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Code lint"
permissions: {}
on:
  push:
    paths:
      - "**"
    branches:
      - "**"
    tags:
      - "v*.*"
  pull_request:
jobs:
  shellchecker:
    name: "ShellChecker"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Needed to checkout the repository (only required for private repositories)

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "ShellChecker"
        uses: a5k-actions/shellchecker@v0

  reuse:
    name: "REUSE compliance check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Needed to checkout the repository (only required for private repositories)

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "REUSE compliance check"
        uses: fsfe/reuse-action@v6

  json-yaml-validate:
    name: "JSON and YAML"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Needed to checkout the repository (only required for private repositories)

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "JSON and YAML - Validator"
        uses: GrantBirki/json-yaml-validate@v4

  rst-check:
    name: "RST guidelines check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Needed to checkout the repository (only required for private repositories)

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "RST guidelines check"
        shell: bash
        run: |
          pip install rstcheck==6.2.5 --quiet --break-system-packages
          rstcheck --recursive .

  final-newline-check:
    name: "Final newline check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Needed to checkout the repository (only required for private repositories)

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "Final newline check"
        shell: bash
        run: |
          status=0
          while IFS= read -r file; do
            if [ -f "${file}" ] && file --mime-type "${file}" | grep -q "text/"; then
              if [ -s "${file}" ]; then
                last_char="$(tail -c1 -- "${file}" | od -An -tx1 | tr -d ' \n')"
                if [ "${last_char}" != "0a" ]; then
                  echo "Missing final newline: ${file}"
                  status=1
                fi
              fi
            fi
          done < <(git ls-files)
          if [ "${status}" -ne 0 ]; then echo 'Result: fail'; exit "${status}"; fi
          echo 'Result: pass'
