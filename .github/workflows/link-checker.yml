---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Link checker"
permissions: {}
on:
  push:
    paths:
      - "**/*.md"
      - "**/*.rst"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.rst"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  schedule:
    # At 02:00 AM, every Sunday (UTC)
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  link-checker:
    name: "Link checker"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write  # Needed to post the report as a PR comment

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "Check links"
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-retries 3
            --accept 200,204,206,429
            --exclude-mail
            ./**/*.md
            ./**/*.rst
          format: markdown
          output: lychee-report.md
          jobSummary: true
          fail: true
      - name: "Upload lychee report"
        if: "${{ always() }}"
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 30
      - name: "Post lychee report as PR comment"
        if: "${{ always() && github.event_name == 'pull_request' }}"
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            /* jshint esversion: 6 */
            const fs = require('fs');
            const marker = '<!-- lychee-report -->';
            let report;
            if (fs.existsSync('lychee-report.md')) {
              report = fs.readFileSync('lychee-report.md', 'utf8');
            } else {
              core.warning('lychee-report.md not found; lychee may not have run.');
              report = '_No lychee report was generated._';
            }
            const body = marker + '\n## 🔗 Link checker report\n\n' + report;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
