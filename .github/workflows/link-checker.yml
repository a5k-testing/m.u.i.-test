---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Link checker"
permissions: {}
on:
  push:
    paths:
      - "**/*.md"
      - "**/*.rst"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.rst"
      - ".github/workflows/link-checker.yml"
      - ".lycheeignore"
  schedule:
    # At 02:00 AM, every Sunday (UTC)
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  link-checker:
    name: "Link checker"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      models: read          # Needed to call GitHub Models for the AI summary
      pull-requests: write  # Needed to post the report as a PR comment

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
      - name: "Check links"
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 20
            --max-retries 3
            --accept 200,204,206,429
            ./**/*.md
            ./**/*.rst
          format: markdown
          output: lychee-report.md
          jobSummary: true
          fail: true
      - name: "Upload lychee report"
        if: "${{ always() }}"
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee-report.md
          retention-days: 30
      - name: "Generate AI summary of link check results"
        if: "${{ always() }}"
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        with:
          retries: 3
          script: |
            /* jshint esversion: 11 */
            const fs = require('fs');
            let lycheeReport;
            if (fs.existsSync('lychee-report.md')) {
              lycheeReport = fs.readFileSync('lychee-report.md', 'utf8');
            } else {
              core.warning(
                'lychee-report.md not found; lychee may not have run.'
              );
              lycheeReport = '(no report available)';
            }
            let aiReply;
            try {
              const res = await fetch(
                'https://models.inference.ai.azure.com/chat/completions',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`
                  },
                  body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    messages: [
                      {
                        role: 'system',
                        content:
                          'You are a CI assistant reviewing link check ' +
                          'results. Summarize the findings in plain ' +
                          'language. If broken links exist, list each one ' +
                          'as a clickable markdown hyperlink. If all links ' +
                          'pass, confirm that clearly.'
                      },
                      {
                        role: 'user',
                        content: `Lychee report:\n\n${lycheeReport}`
                      }
                    ],
                    max_tokens: 1024
                  })
                }
              );
              if (!res.ok) {
                const text = await res.text();
                core.warning(
                  `GitHub Models API error ${res.status}: ${text}`
                );
                aiReply = '_AI summary unavailable (API error)._';
              } else {
                const json = await res.json();
                aiReply =
                  json.choices?.[0]?.message?.content ??
                  '_AI summary unavailable (unexpected response format)._';
              }
            } catch (err) {
              core.warning(
                `Failed to call GitHub Models: ${err.message}`
              );
              aiReply = '_AI summary unavailable (exception)._';
            }
            await core.summary
              .addHeading('🤖 AI summary', 2)
              .addRaw(aiReply)
              .addEOL()
              .write();
            let prNumber = null;
            if (context.eventName === 'pull_request') {
              prNumber = context.issue.number;
            } else if (context.eventName === 'push') {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: branchPrs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                state: 'open',
                per_page: 1
              });
              if (branchPrs.length > 0) {
                prNumber = branchPrs[0].number;
              } else {
                // Fallback: find any open PR that includes changes to
                // link-checker.yml so the report is still visible.
                const { data: openPrs } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 10,
                  sort: 'updated',
                  direction: 'desc'
                });
                const fileResults = await Promise.all(
                  openPrs.map(pr =>
                    github.rest.pulls.listFiles({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number
                    })
                  )
                );
                const idx = fileResults.findIndex(({ data: files }) =>
                  files.some(
                    f =>
                      f.filename ===
                      '.github/workflows/link-checker.yml'
                  )
                );
                if (idx !== -1) {
                  prNumber = openPrs[idx].number;
                }
              }
            }
            if (prNumber !== null) {
              const body =
                '## 🔗 Link check results\n\n' +
                lycheeReport +
                '\n\n## 🤖 AI summary\n\n' +
                aiReply;
              const { data: comments } =
                await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  per_page: 100
                });
              const botComment = comments.find(
                c =>
                  c.user.login === 'github-actions[bot]' &&
                  c.body.includes('## 🔗 Link check results')
              );
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body
                });
              }
            }
