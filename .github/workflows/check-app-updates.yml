---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Check app updates"
permissions: {}
on:
  push:
    paths:
      - ".github/workflows/check-app-updates.yml"
      - "zip-content/origin/**"
      - "tools/test-check-updates.js"
  workflow_dispatch:
  schedule:
    # At 05:00 AM, every 7 days (UTC)
    - cron: "0 5 */7 * *"

jobs:
  check-updates:
    name: "Check updates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Needed to checkout the repository

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: |
            zip-content/origin
      - name: "Extract APK info"
        shell: bash
        run: |
          # Extract package name, version code, and signing certificate SHA-256
          # from APKs listed in file-list.dat.
          # APKs stored in LFS appear as tiny pointer files when lfs: false;
          # those are detected by size and skipped.
          # file-list.dat fields: path|minSdk|maxSdk|apkName|subDir|pkg|sha256
          # (sha256 there is the APK file hash, not the cert hash)

          # Locate aapt: prefer PATH, fall back to Android SDK build-tools
          aapt_bin=''
          if command -v 'aapt' 1>/dev/null; then
            aapt_bin="$(command -v 'aapt')"
          elif test -n "${ANDROID_SDK_ROOT:-}"; then
            aapt_bin="$(find "${ANDROID_SDK_ROOT}/build-tools" \
              -name 'aapt' -type f 2>/dev/null \
              | sort -V | tail -1)"
          fi
          test -n "${aapt_bin}" \
            || { printf 'ERROR: aapt not found\n' >&2; exit 1; }
          printf 'Using aapt: %s\n' "${aapt_bin}"

          apk_count='0'
          json_entries=''
          while IFS='|' read -r \
            path_field min_sdk max_sdk apk_name sub_dir pkg _file_sha256
          do
            # Only process priv-app/ and app/ entries
            case "${path_field}" in
              priv-app/* | app/*) ;;
              *) continue ;;
            esac
            test -n "${pkg}" || continue

            apk_path="${GITHUB_WORKSPACE}/zip-content/origin/${path_field}.apk"
            test -f "${apk_path}" || {
              printf 'WARNING: not found: %s\n' "${apk_path}" >&2
              continue
            }

            file_name="$(basename "${path_field}")"
            # Ensure the filename ends with .apk (path entries in
            # file-list.dat do not include the extension, but guard anyway)
            case "${file_name}" in
              *.apk) ;;
              *) file_name="${file_name}.apk" ;;
            esac

            # Detect LFS pointer files: real APKs are always much larger than
            # the ~130-byte stub written by git-lfs when lfs: false is used
            file_size="$(wc -c < "${apk_path}")"
            if [ "${file_size}" -lt 1000 ]; then
              printf 'WARNING: skipping LFS pointer: %s\n' \
                "${file_name}" >&2
              continue
            fi

            # Version code from APK manifest
            pkg_line="$("${aapt_bin}" dump badging "${apk_path}" \
              2>/dev/null | grep '^package:' || true)"
            version_code="$(printf '%s' "${pkg_line}" \
              | grep -o "[[:space:]]versionCode='[^']*'" \
              | head -1 | cut -d"'" -f2)"

            # SHA-256 of the signing certificate via keytool
            cert_sha256="$(keytool -printcert -jarfile "${apk_path}" \
              2>/dev/null \
              | grep 'SHA256:' | head -1 \
              | sed 's/.*SHA256:[[:space:]]*//' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d '[:space:]')"

            if test -z "${cert_sha256}"; then
              printf 'WARNING: skipping %s (cert not found)\n' \
                "${file_name}" >&2
              continue
            fi

            printf 'INFO: %s: pkg=%s, vc=%s, cert=%s\n' \
              "${file_name}" "${pkg}" \
              "${version_code:-?}" "${cert_sha256}"

            # Build JSON entry (pkg names and hex hashes need no escaping)
            entry='{"fileName":"'"${file_name}"'"'
            entry="${entry}"',"packageName":"'"${pkg}"'"'
            entry="${entry}"',"versionCode":'"${version_code:-0}"
            entry="${entry}"',"certSha256":"'"${cert_sha256}"'"}'
            json_entries="${json_entries:+${json_entries},}${entry}"
            apk_count="$((apk_count + 1))"
          done < "${GITHUB_WORKSPACE}/zip-content/origin/file-list.dat"

          printf '[%s]\n' "${json_entries}" \
            > "${RUNNER_TEMP}/apk_info.json"
          printf 'Written %s APK entries to %s/apk_info.json\n' \
            "${apk_count}" "${RUNNER_TEMP}"
      - name: "Check for updates in F-Droid and microG repos"
        uses: actions/github-script@v8
        timeout-minutes: 25
        with:
          retries: 1
          script: |
            /* jshint esversion: 11 */
            'use strict';
            const fs = require('fs');
            const path = require('path');
            const https = require('https');
            const http = require('http');

            // Load APK info produced by the shell step
            const apkInfoList = JSON.parse(
              fs.readFileSync(
                path.join(process.env.RUNNER_TEMP, 'apk_info.json'),
                'utf-8'
              )
            );
            core.info(`Loaded info for ${apkInfoList.length} APK(s)`);

            // Fetch a URL, following up to maxRedirects redirects
            function fetchUrl(url, maxRedirects = 5) {
              return new Promise((resolve, reject) => {
                const doGet = (targetUrl, remaining) => {
                  const mod =
                    targetUrl.startsWith('https') ? https : http;
                  mod.get(targetUrl, (res) => {
                    if (
                      res.statusCode >= 300 &&
                      res.statusCode < 400 &&
                      res.headers.location
                    ) {
                      if (remaining <= 0) {
                        reject(new Error('Too many redirects'));
                        return;
                      }
                      doGet(res.headers.location, remaining - 1);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error(
                        `HTTP ${res.statusCode} for ${targetUrl}`
                      ));
                      return;
                    }
                    const chunks = [];
                    res.on('data', (c) => chunks.push(c));
                    res.on('end', () =>
                      resolve(Buffer.concat(chunks).toString('utf-8'))
                    );
                    res.on('error', reject);
                  }).on('error', reject);
                };
                doGet(url, maxRedirects);
              });
            }

            // Parse index-v2.json → Map<pkgId, {byCert, latestVc, latestVn}>
            // Each version entry carries manifest.signer.sha256 (array of
            // signing certificate SHA-256 hashes). We index versions by cert
            // so that we can match our local APKs (identified via keytool) to
            // the exact signer family present in the repo.
            function parseRepoV2(data) {
              const apps = new Map();
              for (const [pkgId, pkg] of
                Object.entries(data.packages || {})
              ) {
                let latestVc = null;
                let latestVn = '';
                const byCert = {};
                for (const [, ver] of
                  Object.entries(pkg.versions || {})
                ) {
                  const m = ver.manifest || {};
                  const vc = m.versionCode ?? null;
                  const vn = m.versionName || '';
                  const apkName = ver.file?.name || '';
                  const certs = m.signer?.sha256 ?? [];
                  for (const cert of certs) {
                    const c = cert.toLowerCase();
                    if (
                      !(c in byCert) ||
                      (vc !== null &&
                        (byCert[c].vc === null || vc > byCert[c].vc))
                    ) {
                      byCert[c] = { vc, vn, apkName };
                    }
                  }
                  if (vc !== null &&
                    (latestVc === null || vc > latestVc)
                  ) {
                    latestVc = vc;
                    latestVn = vn;
                  }
                }
                apps.set(pkgId, { byCert, latestVc, latestVn });
              }
              return apps;
            }

            // Shorten a full repo URL to just its base domain
            // e.g. "https://repo.microg.org/fdroid/repo" → "microg.org"
            function shortUrl(url) {
              try {
                const parts = new URL(url).hostname.split('.');
                return parts.slice(-2).join('.');
              } catch (_) {
                return url;
              }
            }

            // Unicode icons for each result state
            const ICON = {
              UPDATE_AVAILABLE: '📥',
              UP_TO_DATE:       '✅',
              LOCAL_NEWER:      '🏆',
              DIFFERENT_SIGNER: '🔐',
              NOT_IN_REPO:      '🚫',
            };

            // Packages that also get a fallback cert check
            const SPECIAL_PKG_CERT =
              'f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83';
            const SPECIAL_PKGS = new Set([
              'com.google.android.gms',
              'com.android.vending',
            ]);

            // Ordered list of F-Droid-compatible repository base URLs.
            // "/index-v2.json" is appended automatically when fetching.
            const repos = [
              'https://f-droid.org/repo',
              'https://repo.microg.org/fdroid/repo',
            ];

            // Fetch and parse every repo index
            const repoData = [];
            for (const baseUrl of repos) {
              const indexUrl = `${baseUrl}/index-v2.json`;
              core.info(`Fetching ${indexUrl}…`);
              const data = JSON.parse(await fetchUrl(indexUrl));
              const apps = parseRepoV2(data);
              core.info(`  Parsed ${apps.size} app(s) from ${baseUrl}`);
              repoData.push({ baseUrl, apps });
            }

            // Collect rows for Job Summary table
            const summaryRows = [];

            // Report results
            core.info('');
            core.info('=== Update Check Results ===');
            for (const apk of apkInfoList) {
              // Loop through repos in order; stop at the first one that has
              // both a matching package name and a matching signing certificate
              let certMatch = null;
              for (const { baseUrl, apps } of repoData) {
                const pkg = apps.get(apk.packageName);
                const ver = pkg?.byCert[apk.certSha256];
                if (ver) {
                  certMatch = { baseUrl, ver };
                  break;
                }
                // Special fallback for GMS packages: also try known cert
                if (SPECIAL_PKGS.has(apk.packageName)) {
                  const verFallback = pkg?.byCert[SPECIAL_PKG_CERT];
                  if (verFallback) {
                    certMatch = { baseUrl, ver: verFallback };
                    break;
                  }
                }
              }

              if (certMatch) {
                // Package found with our signing certificate
                const { baseUrl, ver } = certMatch;
                const label = shortUrl(baseUrl);
                const localVc = apk.versionCode;
                const repoVc = ver.vc;
                const apkUrl =
                  ver.apkName ? `${baseUrl}${ver.apkName}` : '';
                let statusText;
                if (repoVc !== null && localVc) {
                  if (repoVc > localVc) {
                    statusText =
                      `${ICON.UPDATE_AVAILABLE} UPDATE AVAILABLE:` +
                      ` repo=${ver.vn} (${repoVc})` +
                      ` > local (${localVc})`;
                  } else if (repoVc === localVc) {
                    statusText =
                      `${ICON.UP_TO_DATE} UP TO DATE (versionCode=${localVc})`;
                  } else {
                    statusText =
                      `${ICON.LOCAL_NEWER} LOCAL NEWER: local (${localVc})` +
                      ` > repo (${repoVc})`;
                  }
                } else {
                  statusText = `found, latest=${ver.vn}`;
                }
                core.info(
                  `[${label}] ${apk.fileName}` +
                  ` (${apk.packageName}): ${statusText}`
                );
                if (repoVc !== null && localVc && repoVc > localVc) {
                  core.notice(
                    `[${label}] ${apk.fileName} (${apk.packageName}):` +
                    ` ${statusText}` +
                    (apkUrl ? `\n${apkUrl}` : ''),
                    { title: 'Update Available' }
                  );
                }
                if (repoVc !== null && localVc && repoVc < localVc) {
                  core.warning(
                    `${apk.fileName} (${apk.packageName}): ${statusText}`,
                    { title: 'Local Newer' }
                  );
                }
                summaryRows.push([
                  apk.fileName,
                  apk.packageName,
                  label,
                  statusText,
                ]);
              } else {
                // Collect repos where the package exists under a different cert
                const signerMismatch = repoData
                  .filter(({ apps }) => apps.has(apk.packageName))
                  .map(({ baseUrl, apps }) => {
                    const p = apps.get(apk.packageName);
                    return `${shortUrl(baseUrl)} (latest=${p.latestVn} ${p.latestVc})`;
                  });
                let repoLabel, statusText;
                if (signerMismatch.length > 0) {
                  repoLabel = signerMismatch.join(', ');
                  statusText = `${ICON.DIFFERENT_SIGNER} DIFFERENT SIGNER`;
                  core.info(
                    `[DIFFERENT SIGNER] ${apk.fileName}` +
                    ` (${apk.packageName}):` +
                    ` ${repoLabel}` +
                    ` but signed with a different certificate`
                  );
                } else {
                  repoLabel = '-';
                  statusText = `${ICON.NOT_IN_REPO} NOT IN REPO`;
                  core.info(
                    `[NOT IN REPO] ${apk.fileName}` +
                    ` (${apk.packageName}): not found in any repo`
                  );
                }
                summaryRows.push([
                  apk.fileName,
                  apk.packageName,
                  repoLabel,
                  statusText,
                ]);
              }
            }

            // Write Job Summary table
            await core.summary
              .addHeading('Update Check Results')
              .addTable([
                [
                  { data: 'APK', header: true },
                  { data: 'Package', header: true },
                  { data: 'Repo', header: true },
                  { data: 'Status', header: true },
                ],
                ...summaryRows,
              ])
              .write();
