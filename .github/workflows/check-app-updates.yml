---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Check app updates"
permissions: {}
on:
  workflow_dispatch:
  schedule:
    # At 05:00 AM, every 7 days (UTC)
    - cron: "0 5 */7 * *"

jobs:
  check-updates:
    name: "Check updates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Needed to checkout the repository

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: |
            zip-content/origin/file-list.dat
          sparse-checkout-cone-mode: false
      - name: "Parse APK list"
        shell: bash
        run: |
          # Parse file-list.dat to obtain package names and APK SHA-256 hashes.
          # No APK binaries are downloaded; all data comes from the plain-text
          # file-list.dat which is not LFS-tracked.
          # file-list.dat fields: path|minSdk|maxSdk|apkName|subDir|pkg|sha256

          apk_count='0'
          json_entries=''
          while IFS='|' read -r \
            path_field min_sdk max_sdk apk_name sub_dir pkg sha256
          do
            # Only process priv-app/ and app/ entries
            case "${path_field}" in
              priv-app/* | app/*) ;;
              *) continue ;;
            esac
            # Skip entries with no package name or hash
            test -n "${pkg}" || continue
            test -n "${sha256}" || continue

            file_name="$(basename "${path_field}")"
            # Ensure the filename ends with .apk (path entries in
            # file-list.dat do not include the extension, but guard anyway)
            case "${file_name}" in
              *.apk) ;;
              *) file_name="${file_name}.apk" ;;
            esac
            printf 'INFO: %s: package=%s, sha256=%s\n' \
              "${file_name}" "${pkg}" "${sha256}"

            # Build JSON entry (pkg names and hex SHA-256s need no escaping)
            entry='{"fileName":"'"${file_name}"'"'
            entry="${entry}"',"packageName":"'"${pkg}"'"'
            entry="${entry}"',"sha256":"'"${sha256}"'"}'
            json_entries="${json_entries:+${json_entries},}${entry}"
            apk_count="$((apk_count + 1))"
          done < "${GITHUB_WORKSPACE}/zip-content/origin/file-list.dat"

          printf '[%s]\n' "${json_entries}" \
            > "${RUNNER_TEMP}/apk_info.json"
          printf 'Written %s APK entries to %s/apk_info.json\n' \
            "${apk_count}" "${RUNNER_TEMP}"
      - name: "Check for updates in F-Droid and microG repos"
        uses: actions/github-script@v8
        timeout-minutes: 25
        with:
          retries: 1
          script: |
            /* jshint esversion: 11 */
            'use strict';
            const fs = require('fs');
            const path = require('path');
            const https = require('https');
            const http = require('http');

            // Load APK info produced by the shell step
            const apkInfoList = JSON.parse(
              fs.readFileSync(
                path.join(process.env.RUNNER_TEMP, 'apk_info.json'),
                'utf-8'
              )
            );
            core.info(`Loaded info for ${apkInfoList.length} APK(s)`);

            // Fetch a URL, following up to maxRedirects redirects
            function fetchUrl(url, maxRedirects = 5) {
              return new Promise((resolve, reject) => {
                const doGet = (targetUrl, remaining) => {
                  const mod =
                    targetUrl.startsWith('https') ? https : http;
                  mod.get(targetUrl, (res) => {
                    if (
                      res.statusCode >= 300 &&
                      res.statusCode < 400 &&
                      res.headers.location
                    ) {
                      if (remaining <= 0) {
                        reject(new Error('Too many redirects'));
                        return;
                      }
                      doGet(res.headers.location, remaining - 1);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error(
                        `HTTP ${res.statusCode} for ${targetUrl}`
                      ));
                      return;
                    }
                    const chunks = [];
                    res.on('data', (c) => chunks.push(c));
                    res.on('end', () =>
                      resolve(Buffer.concat(chunks).toString('utf-8'))
                    );
                    res.on('error', reject);
                  }).on('error', reject);
                };
                doGet(url, maxRedirects);
              });
            }

            // Parse index-v2.json → Map<pkgId, {bySha256, latestVc, latestVn}>
            // In index-v2.json each version is keyed by the SHA-256 of its APK
            // file, which matches the hashes stored in file-list.dat.
            function parseRepoV2(data) {
              const apps = new Map();
              for (const [pkgId, pkg] of
                Object.entries(data.packages || {})
              ) {
                let latestVc = null;
                let latestVn = '';
                const bySha256 = {};
                for (const [sha256, ver] of
                  Object.entries(pkg.versions || {})
                ) {
                  const m = ver.manifest || {};
                  const vc = m.versionCode ?? null;
                  const vn = m.versionName || '';
                  bySha256[sha256] = { vc, vn };
                  if (vc !== null &&
                    (latestVc === null || vc > latestVc)
                  ) {
                    latestVc = vc;
                    latestVn = vn;
                  }
                }
                apps.set(pkgId, { bySha256, latestVc, latestVn });
              }
              return apps;
            }

            // Fetch and parse F-Droid repo
            core.info('Fetching F-Droid index-v2.json…');
            const fdroidData = JSON.parse(await fetchUrl(
              'https://f-droid.org/repo/index-v2.json'
            ));
            const fdroidApps = parseRepoV2(fdroidData);
            core.info(
              `  Parsed ${fdroidApps.size} app(s) from F-Droid`
            );

            // Fetch and parse microG repo
            core.info('Fetching microG repo index-v2.json…');
            const microgData = JSON.parse(await fetchUrl(
              'https://repo.microg.org/fdroid/repo/index-v2.json'
            ));
            const microgApps = parseRepoV2(microgData);
            core.info(
              `  Parsed ${microgApps.size} app(s) from microG`
            );

            // Report results
            core.info('');
            core.info('=== Update Check Results ===');
            for (const apk of apkInfoList) {
              const fp = fdroidApps.get(apk.packageName);
              const mp = microgApps.get(apk.packageName);
              // Direct version lookup: index-v2 versions are keyed by APK SHA-256
              const fv = fp?.bySha256[apk.sha256];
              const mv = mp?.bySha256[apk.sha256];

              if (fv || mv) {
                // Our exact APK is present in one of the repos
                const repo = fv ? 'F-Droid' : 'microG';
                const info = fv ? fp : mp;
                const localVc = (fv ?? mv).vc;
                const repoVc = info.latestVc;
                let status;
                if (repoVc !== null && localVc !== null) {
                  if (repoVc > localVc) {
                    status =
                      `UPDATE AVAILABLE:` +
                      ` repo=${info.latestVn} (${repoVc})` +
                      ` > local (${localVc})`;
                  } else if (repoVc === localVc) {
                    status =
                      `UP TO DATE (versionCode=${localVc})`;
                  } else {
                    status =
                      `LOCAL NEWER: local (${localVc})` +
                      ` > repo (${repoVc})`;
                  }
                } else {
                  status = `found, latest=${info.latestVn}`;
                }
                core.info(
                  `[${repo}] ${apk.fileName}` +
                  ` (${apk.packageName}): ${status}`
                );
              } else if (fp || mp) {
                // Package is in a repo but our APK hash was not found
                const repos = [fp && 'F-Droid', mp && 'microG']
                  .filter(Boolean).join(', ');
                const latestVn = (fp ?? mp).latestVn;
                const latestVc = (fp ?? mp).latestVc;
                core.info(
                  `[UNKNOWN VERSION] ${apk.fileName}` +
                  ` (${apk.packageName}): in ${repos},` +
                  ` latest=${latestVn} (${latestVc})`
                );
              } else {
                core.info(
                  `[NOT IN REPO] ${apk.fileName}` +
                  ` (${apk.packageName}): not found in any repo`
                );
              }
            }
