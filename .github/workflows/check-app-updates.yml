---
# SPDX-FileCopyrightText: NONE
# SPDX-License-Identifier: CC0-1.0

name: "Check app updates"
permissions: {}
on:
  workflow_dispatch:
  schedule:
    # At 05:00 AM, every 7 days (UTC)
    - cron: "0 5 */7 * *"

jobs:
  check-updates:
    name: "Check updates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # Needed to checkout the repository

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: "Extract APK info"
        shell: bash
        run: |
          # Extract package name, version code, and SHA-256 signature from APKs.
          # Uses only preinstalled tools: aapt (Android SDK build-tools) + keytool (JDK).

          # Locate aapt: prefer PATH, fall back to Android SDK build-tools
          aapt_bin=''
          if command -v 'aapt' 1>/dev/null; then
            aapt_bin="$(command -v 'aapt')"
          elif test -n "${ANDROID_SDK_ROOT:-}"; then
            aapt_bin="$(find "${ANDROID_SDK_ROOT}/build-tools" \
              -name 'aapt' -type f 2>/dev/null \
              | sort -V | tail -1)"
          fi
          test -n "${aapt_bin}" \
            || { printf 'ERROR: aapt not found\n' >&2; exit 1; }
          printf 'Using aapt: %s\n' "${aapt_bin}"

          apk_count='0'
          json_entries=''
          for apk_dir in \
            'zip-content/origin/priv-app' \
            'zip-content/origin/app'
          do
            for apk_path in "${GITHUB_WORKSPACE}/${apk_dir}"/*.apk; do
              test -f "${apk_path}" || continue
              file_name="$(basename "${apk_path}")"

              # Package name: anchored sed avoids matching 'codename=' attrs
              pkg_line="$("${aapt_bin}" dump badging "${apk_path}" \
                2>/dev/null | grep '^package:' || true)"
              pkg_name="$(printf '%s' "${pkg_line}" \
                | sed "s/^package:[[:space:]]*name='\([^']*\)'.*/\1/")"
              version_code="$(printf '%s' "${pkg_line}" \
                | grep -o "[[:space:]]versionCode='[^']*'" \
                | head -1 | cut -d"'" -f2)"

              # SHA-256 certificate fingerprint via keytool
              signature="$(keytool -printcert -jarfile "${apk_path}" \
                2>/dev/null \
                | grep 'SHA256:' | head -1 \
                | sed 's/.*SHA256:[[:space:]]*//' \
                | tr -d ':' \
                | tr '[:upper:]' '[:lower:]' \
                | tr -d '[:space:]')"

              if test -z "${pkg_name}" || test -z "${signature}"; then
                printf 'WARNING: skipping %s (pkg=%s, sig=%s)\n' \
                  "${file_name}" \
                  "${pkg_name:-missing}" \
                  "${signature:-missing}" >&2
                continue
              fi

              printf 'INFO: %s: package=%s, versionCode=%s, sig=%s\n' \
                "${file_name}" "${pkg_name}" \
                "${version_code:-?}" "${signature}"

              # Build JSON entry (package names and hex sigs need no escaping)
              entry='{"fileName":"'"${file_name}"'"'
              entry="${entry}"',"packageName":"'"${pkg_name}"'"'
              entry="${entry}"',"versionCode":'"${version_code:-0}"
              entry="${entry}"',"signature":"'"${signature}"'"}'
              json_entries="${json_entries:+${json_entries},}${entry}"
              apk_count="$((apk_count + 1))"
            done
          done

          printf '[%s]\n' "${json_entries}" \
            > "${RUNNER_TEMP}/apk_info.json"
          printf 'Written %s APK entries to %s/apk_info.json\n' \
            "${apk_count}" "${RUNNER_TEMP}"
      - name: "Check for updates in F-Droid and microG repos"
        uses: actions/github-script@v8
        timeout-minutes: 25
        with:
          retries: 1
          script: |
            /* jshint esversion: 11 */
            'use strict';
            const fs = require('fs');
            const path = require('path');
            const https = require('https');
            const http = require('http');

            // Load APK info produced by the shell step
            const apkInfoList = JSON.parse(
              fs.readFileSync(
                path.join(process.env.RUNNER_TEMP, 'apk_info.json'),
                'utf-8'
              )
            );
            core.info(`Loaded info for ${apkInfoList.length} APK(s)`);

            // Fetch a URL, following up to maxRedirects redirects
            function fetchUrl(url, maxRedirects = 5) {
              return new Promise((resolve, reject) => {
                const doGet = (targetUrl, remaining) => {
                  const mod =
                    targetUrl.startsWith('https') ? https : http;
                  mod.get(targetUrl, (res) => {
                    if (
                      res.statusCode >= 300 &&
                      res.statusCode < 400 &&
                      res.headers.location
                    ) {
                      if (remaining <= 0) {
                        reject(new Error('Too many redirects'));
                        return;
                      }
                      doGet(res.headers.location, remaining - 1);
                      return;
                    }
                    if (res.statusCode !== 200) {
                      reject(new Error(
                        `HTTP ${res.statusCode} for ${targetUrl}`
                      ));
                      return;
                    }
                    const chunks = [];
                    res.on('data', (c) => chunks.push(c));
                    res.on('end', () =>
                      resolve(Buffer.concat(chunks).toString('utf-8'))
                    );
                    res.on('error', reject);
                  }).on('error', reject);
                };
                doGet(url, maxRedirects);
              });
            }

            // Parse a repo's index.xml → Map<packageId, {sig, version, versionCode}>
            function parseRepoXml(xml) {
              const apps = new Map();
              const parts = xml.split('<application ');
              for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                const idM = part.match(/^\s*id="([^"]+)"/);
                if (!idM) continue;
                const id = idM[1];

                const endIdx = part.indexOf('</application>');
                if (endIdx === -1) continue;
                const body = part.substring(0, endIdx);

                // Only inspect app-level fields (before the first <package>)
                const pkgIdx = body.indexOf('<package>');
                const appBody =
                  pkgIdx !== -1 ? body.substring(0, pkgIdx) : body;

                const sigM = appBody.match(
                  /<sig>([0-9a-fA-F]{32,64})<\/sig>/
                );
                const verM = appBody.match(
                  /<marketversion>([^<]*)<\/marketversion>/
                );
                const vercodeM = appBody.match(
                  /<marketvercode>(\d+)<\/marketvercode>/
                );

                if (sigM) {
                  apps.set(id, {
                    sig: sigM[1].toLowerCase(),
                    version: verM ? verM[1] : '',
                    versionCode: vercodeM
                      ? parseInt(vercodeM[1], 10)
                      : null,
                  });
                }
              }
              return apps;
            }

            // Fetch and parse F-Droid repo
            core.info('Fetching F-Droid index.xml…');
            const fdroidXml = await fetchUrl(
              'https://f-droid.org/repo/index.xml'
            );
            const fdroidApps = parseRepoXml(fdroidXml);
            core.info(
              `  Parsed ${fdroidApps.size} app(s) from F-Droid`
            );

            // Fetch and parse microG repo
            core.info('Fetching microG repo index.xml…');
            const microgXml = await fetchUrl(
              'https://repo.microg.org/fdroid/repo/index.xml'
            );
            const microgApps = parseRepoXml(microgXml);
            core.info(
              `  Parsed ${microgApps.size} app(s) from microG`
            );

            // Report results
            core.info('');
            core.info('=== Update Check Results ===');
            for (const apk of apkInfoList) {
              const inFdroid = fdroidApps.get(apk.packageName);
              const inMicrog = microgApps.get(apk.packageName);
              const fdroidMatch =
                inFdroid && inFdroid.sig === apk.signature;
              const microgMatch =
                inMicrog && inMicrog.sig === apk.signature;

              if (fdroidMatch || microgMatch) {
                const repoName = fdroidMatch ? 'F-Droid' : 'microG';
                const repoInfo = fdroidMatch ? inFdroid : inMicrog;
                const repoVc = repoInfo.versionCode;
                const localVc = apk.versionCode;
                let status;
                if (repoVc !== null && localVc !== null) {
                  if (repoVc > localVc) {
                    status =
                      `UPDATE AVAILABLE: repo=${repoInfo.version}` +
                      ` (${repoVc}) > local (${localVc})`;
                  } else if (repoVc === localVc) {
                    status =
                      `UP TO DATE (versionCode=${localVc})`;
                  } else {
                    status =
                      `LOCAL NEWER: local (${localVc})` +
                      ` > repo (${repoVc})`;
                  }
                } else {
                  status =
                    `found in ${repoName}:` +
                    ` latest=${repoInfo.version}`;
                }
                core.info(
                  `[${repoName}] ${apk.fileName}` +
                  ` (${apk.packageName}): ${status}`
                );
              } else if (inFdroid || inMicrog) {
                const repos = [
                  inFdroid && 'F-Droid',
                  inMicrog && 'microG',
                ].filter(Boolean).join(', ');
                core.info(
                  `[SIG MISMATCH] ${apk.fileName}` +
                  ` (${apk.packageName}): found in ${repos}` +
                  ` but signature does not match`
                );
                if (inFdroid) {
                  core.info(`  F-Droid sig : ${inFdroid.sig}`);
                }
                if (inMicrog) {
                  core.info(`  microG sig  : ${inMicrog.sig}`);
                }
                core.info(`  Local sig   : ${apk.signature}`);
              } else {
                core.info(
                  `[NOT IN REPO] ${apk.fileName}` +
                  ` (${apk.packageName}): not found in any repo`
                );
              }
            }
